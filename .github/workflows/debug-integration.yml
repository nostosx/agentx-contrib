name: Debug browser integration

on:
  workflow_call:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: go-task/setup-task@v2
        with:
          version: '3.53.1'
      - uses: actions/setup-go@v7
        with:
          go-version-file: debug/go.mod
          cache-dependency-path: debug/go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install isolated browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/agentx-debug-browser" --no-audit --no-fund --ignore-scripts playwright@1.64.1
          node "$RUNNER_TEMP/agentx-debug-browser/node_modules/playwright/cli.js" install --with-deps chromium webkit
      - name: Chromium and WebKit acceptance without skips
        env:
          GOWORK: 'off'
          GOTOOLCHAIN: local
        run: |
          AGENTX_IT_NODE="$(command -v node)" \
          AGENTX_IT_PLAYWRIGHT="$RUNNER_TEMP/agentx-debug-browser/node_modules/playwright/index.mjs" \
          task test INTEGRATION=true MODULES=debug
