name: Release

# Run every gate before creating a tag: a version the module proxy has seen
# cannot be withdrawn. The module must use a released core; see RELEASING.md.
on:
  workflow_dispatch:
    inputs:
      module:
        description: Module to release
        required: true
        type: choice
        options: [document, filestore, middleware, otel, pgvector, provider, s3, sqlstore]
      version:
        description: Version to release, such as v1.0.0
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.module }}
  cancel-in-progress: false

env:
  GOWORK: "off"
  GOTOOLCHAIN: local
  MODULE: ${{ inputs.module }}
  VERSION: ${{ inputs.version }}

defaults:
  run:
    shell: bash

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.module }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Task
        uses: go-task/setup-task@v2
        with:
          version: '3.53.1'
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ inputs.module }}/go.mod
          cache-dependency-path: ${{ inputs.module }}/go.sum
      - name: Check version and go.mod
        run: |
          prerelease='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          version_re="^v(0|1)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)(-$prerelease(\\.$prerelease)*)?$"
          echo "$VERSION" | grep -Eq "$version_re" || { echo "bad version $VERSION"; exit 1; }
          if echo "$VERSION" | grep -Eq -- '[.-][0-9]{14}-[0-9a-f]{12}$'; then
            echo "release version must not be a pseudo-version"; exit 1
          fi
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "release from main"; exit 1; }
          tag="$MODULE/$VERSION"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then echo "$tag exists"; exit 1; fi
          if [ -n "$(go mod edit -json | jq -r '.Replace // [] | .[].Old.Path')" ]; then
            echo "$MODULE/go.mod still replaces modules; select released dependencies as described in RELEASING.md"; exit 1
          fi
          core=$(go list -m -f '{{.Version}}' github.com/nostosx/agentx)
          echo "$core" | grep -Eq "$version_re" || { echo "bad core version $core"; exit 1; }
          if echo "$core" | grep -Eq -- '[.-][0-9]{14}-[0-9a-f]{12}$'; then
            echo "$MODULE/go.mod requires an unreleased core"; exit 1
          fi
          kit=$(go list -m -f '{{.Version}}' github.com/nostosx/kitx)
          echo "$kit" | grep -Eq "$version_re" || { echo "bad kitx version $kit"; exit 1; }
          if echo "$kit" | grep -Eq -- '[.-][0-9]{14}-[0-9a-f]{12}$'; then
            echo "$MODULE/go.mod requires an unreleased kitx"; exit 1
          fi
          cmp LICENSE ../LICENSE
          awk -v v="$tag" '/^## /{p = ($2 == v); next} p' ../CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          grep -q . "$RUNNER_TEMP/notes.md" || { echo "CHANGELOG.md has no section ## $tag"; exit 1; }
      - name: Verify selected module
        run: task --dir .. check MODULES="$MODULE"
      - uses: golangci/golangci-lint-action@v9
        with:
          install-mode: goinstall
          version: v2.15.0
          install-only: true
      - run: task --dir .. lint MODULES="$MODULE"
      - name: Install scanner outside the module
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - run: task --dir .. vulncheck MODULES="$MODULE"

  document-integration:
    if: inputs.module == 'document'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: go-task/setup-task@v2
        with:
          version: '3.53.1'
      - uses: actions/setup-go@v7
        with:
          go-version-file: document/go.mod
          cache-dependency-path: document/go.sum
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Real PDF conversion without skips
        env:
          AGENTX_IT_PDFTOTEXT: /usr/bin/pdftotext
        run: task test INTEGRATION=true MODULES=document

  pgvector-integration:
    if: inputs.module == 'pgvector'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: agentx
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: go-task/setup-task@v2
        with:
          version: '3.53.1'
      - uses: actions/setup-go@v7
        with:
          go-version-file: pgvector/go.mod
          cache-dependency-path: pgvector/go.sum
      - name: Enable vector extension in disposable database
        run: docker exec "${{ job.services.postgres.id }}" psql -U postgres -d agentx -c 'CREATE EXTENSION vector'
      - name: Real pgvector acceptance without skips
        env:
          AGENTX_IT_PGVECTOR_DSN: postgres://postgres@localhost:5432/agentx?sslmode=disable
        run: task test INTEGRATION=true MODULES=pgvector

  sqlstore-integration:
    if: inputs.module == 'sqlstore'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: agentx
          POSTGRES_DB: agentx
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 30
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: agentx
          MYSQL_DATABASE: agentx
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pagentx"
          --health-interval 2s --health-timeout 5s --health-retries 60
    defaults:
      run:
        shell: bash
        working-directory: sqlstore
    steps:
      - uses: actions/checkout@v7
      - name: Install Task
        uses: go-task/setup-task@v2
        with:
          version: '3.53.1'
      - uses: actions/setup-go@v7
        with:
          go-version-file: sqlstore/go.mod
          cache-dependency-path: sqlstore/go.sum
      - name: Integration tests on PostgreSQL and MySQL
        env:
          AGENTX_IT_POSTGRES_DSN: postgres://postgres:agentx@localhost:5432/agentx?sslmode=disable
          AGENTX_IT_MYSQL_DSN: root:agentx@tcp(localhost:3306)/agentx
        run: task --dir .. test INTEGRATION=true MODULES=sqlstore

  release:
    needs: [verify, sqlstore-integration, pgvector-integration, document-integration]
    if: >-
      ${{ !cancelled() && needs.verify.result == 'success' &&
          (inputs.module != 'sqlstore' || needs.sqlstore-integration.result == 'success') &&
          (inputs.module != 'pgvector' || needs.pgvector-integration.result == 'success') &&
          (inputs.module != 'document' || needs.document-integration.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        working-directory: ${{ inputs.module }}
    steps:
      - uses: actions/checkout@v7
      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$MODULE/$VERSION"
          awk -v v="$tag" '/^## /{p = ($2 == v); next} p' ../CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          gh release create "$tag" --target "$GITHUB_SHA" --title "$MODULE $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ inputs.module }}/go.mod
          cache-dependency-path: ${{ inputs.module }}/go.sum
      - name: Warm module proxy
        run: GOPROXY=https://proxy.golang.org go list -m "github.com/nostosx/agentx-contrib/$MODULE@$VERSION"
