name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GOWORK: "off"
  GOTOOLCHAIN: local

defaults:
  run:
    shell: bash
    working-directory: agentx-contrib
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        module: [artifact, browser, debug, document, embedding, filestore, loader, middleware, otel, pgvector, provider, retrieval, s3, search, sqlstore, web]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          path: agentx-contrib
      - name: Install Task
        uses: go-task/setup-task@v2
        with:
          version: '3.53.1'
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          cache: false
      - run: task check MODULES="${{ matrix.module }}"

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          path: agentx-contrib
      - name: Install Task
        uses: go-task/setup-task@v2
        with:
          version: '3.53.1'
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          cache: false
      - uses: golangci/golangci-lint-action@v9
        with:
          install-mode: goinstall
          version: v2.15.0
          install-only: true
      - run: task lint

  vulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          path: agentx-contrib
      - name: Install Task
        uses: go-task/setup-task@v2
        with:
          version: '3.53.1'
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          cache: false
      - name: Install scanner outside the module
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - run: task vulncheck

  document-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          path: agentx-contrib
      - uses: go-task/setup-task@v2
        with:
          version: '3.53.1'
      - uses: actions/setup-go@v7
        with:
          go-version-file: agentx-contrib/document/go.mod
          cache-dependency-path: agentx-contrib/document/go.sum
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr
      - name: Real PDF conversion without skips
        working-directory: agentx-contrib
        env:
          AGENTX_IT_PDFTOTEXT: /usr/bin/pdftotext
          AGENTX_IT_TESSERACT: /usr/bin/tesseract
          AGENTX_IT_PDFTOPPM: /usr/bin/pdftoppm
        run: task test INTEGRATION=true MODULES=document

  pgvector-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: agentx
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v7
        with:
          path: agentx-contrib
      - uses: go-task/setup-task@v2
        with:
          version: '3.53.1'
      - uses: actions/setup-go@v7
        with:
          go-version-file: agentx-contrib/pgvector/go.mod
          cache-dependency-path: agentx-contrib/pgvector/go.sum
      - name: Enable vector extension in disposable database
        run: docker exec "${{ job.services.postgres.id }}" psql -U postgres -d agentx -c 'CREATE EXTENSION vector'
      - name: Real pgvector acceptance without skips
        working-directory: agentx-contrib
        env:
          AGENTX_IT_PGVECTOR_DSN: postgres://postgres@localhost:5432/agentx?sslmode=disable
        run: task test INTEGRATION=true MODULES=pgvector

  sqlstore-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: agentx
          POSTGRES_DB: agentx
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 30
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: agentx
          MYSQL_DATABASE: agentx
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pagentx"
          --health-interval 2s --health-timeout 5s --health-retries 60
    defaults:
      run:
        working-directory: agentx-contrib
    steps:
      - uses: actions/checkout@v7
        with:
          path: agentx-contrib
      - name: Install Task
        uses: go-task/setup-task@v2
        with:
          version: '3.53.1'
      - uses: actions/setup-go@v7
        with:
          go-version-file: agentx-contrib/sqlstore/go.mod
          cache-dependency-path: agentx-contrib/sqlstore/go.sum
      - name: Integration tests
        env:
          AGENTX_IT_POSTGRES_DSN: postgres://postgres:agentx@localhost:5432/agentx?sslmode=disable
          AGENTX_IT_MYSQL_DSN: root:agentx@tcp(localhost:3306)/agentx
        run: task test INTEGRATION=true MODULES=sqlstore

  retrieval-integration:
    uses: ./.github/workflows/retrieval-integration.yml

  debug-integration:
    uses: ./.github/workflows/debug-integration.yml

  browser-integration:
    uses: ./.github/workflows/browser-integration.yml
