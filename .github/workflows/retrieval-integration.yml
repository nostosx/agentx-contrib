name: Retrieval integration

on:
  workflow_call:

permissions:
  contents: read

jobs:
  retrieval:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      qdrant:
        image: qdrant/qdrant:v1.18.0
        ports: ["6333:6333"]
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:9.2.0
        env:
          discovery.type: single-node
          xpack.security.enabled: 'false'
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports: ["9200:9200"]
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: agentx
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: go-task/setup-task@v2
        with:
          version: '3.53.1'
      - uses: actions/setup-go@v7
        with:
          go-version-file: retrieval/go.mod
          cache-dependency-path: retrieval/go.sum
      - name: Enable vector in the owned database
        run: docker exec "${{ job.services.postgres.id }}" psql -U postgres -d agentx -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION vector'
      - name: Wait for disposable backends
        shell: bash
        run: |
          set -euo pipefail
          for endpoint in http://127.0.0.1:6333/readyz http://127.0.0.1:9200; do
            ready=false
            for _ in {1..60}; do
              if curl -fsS --max-time 2 "$endpoint" >/dev/null; then ready=true; break; fi
              sleep 1
            done
            test "$ready" = true || exit 1
          done
      - name: Real retrieval acceptance without skips
        env:
          AGENTX_IT_SERVEX_POSTGRES_DSN: postgres://postgres@localhost:5432/agentx?sslmode=disable
          AGENTX_IT_QDRANT_URL: http://127.0.0.1:6333
          AGENTX_IT_ELASTICSEARCH_URL: http://127.0.0.1:9200
          GOWORK: 'off'
          GOTOOLCHAIN: local
        run: task test INTEGRATION=true MODULES=retrieval
